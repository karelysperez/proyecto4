<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>proyecto4</title>
    <link rel="stylesheet" href="/src/style.css">  </head>
  <body>
    <header>
        <h1>Our Reviews</h1>
    </header>

    <main>

        <div class="reviews">
            <img src="" alt="" class="avatar">
            <h2 class="name"></h2>
            <p class="job"></p>
            <p class="text"></p>

        <div class="arrows">

            <button class="next">

    </main>
