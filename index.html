<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>proyecto4</title>
  </head>
  <body>
    <header>
        <h1>Our Reviews</h1>
    </header>

    <main>

        <div class="reviews">

            <div class="icon&img">

                <img src="" alt="" class="avatar">
                <img src="/quote-icon.png" alt="quotes-icon" class="quote">
            </div>

            <h2 class="name"></h2>
            <p class="job"></p>
            <p class="text"></p>
        </div>

        <div class="arrows">

            <button class="prev">
                <img alt="arrow to next review" src="/next.png">
            </button>

            <button class="next">
                <img alt="arrow to previous review " src="/prev.png">
            </button>
        </div>

        <button class="random">Surprise me!</button>

    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
